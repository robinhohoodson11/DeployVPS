<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#18181b"/>
      <stop offset="100%" style="stop-color:#09090b"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <!-- Border glow effect -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
  <!-- Terminal window top bar -->
  <rect x="10" y="10" width="44" height="6" rx="3" fill="#27272a"/>
  <circle cx="15" cy="13" r="1.5" fill="#ef4444"/>
  <circle cx="21" cy="13" r="1.5" fill="#eab308"/>
  <circle cx="27" cy="13" r="1.5" fill="#22c55e"/>
  <!-- Terminal content area -->
  <rect x="10" y="18" width="44" height="36" rx="0 0 3 3" fill="#0a0a0a"/>
  <!-- Command prompt lines -->
  <text x="14" y="30" font-family="monospace" font-size="8" fill="#22c55e">$</text>
  <text x="22" y="30" font-family="monospace" font-size="8" fill="#a1a1aa">deploy</text>
  <!-- Upload arrow icon -->
  <path d="M32 36 L32 48" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 42 L32 36 L38 42" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>